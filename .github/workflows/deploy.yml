name: CD - Deployment Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar proyecto
        run: mvn -B clean package

  acceptance-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ejecutar pruebas de aceptación
        run: mvn -B -Dtest=cl.iplacex.automatizacion.acceptance.* test

  deploy-to-test:
    runs-on: ubuntu-latest
    needs: acceptance-tests
    steps:
      - name: Simular despliegue en ambiente de prueba
        run: |
          echo "Desplegando versión en TEST..."
          echo "version=1.0.$GITHUB_RUN_NUMBER" > deployed_version.txt
          cat deployed_version.txt

      - name: Guardar artefacto del despliegue
        uses: actions/upload-artifact@v4
        with:
          name: deployed_version
          path: deployed_version.txt

  rollback:
    runs-on: ubuntu-latest
    needs: deploy-to-test
    if: failure()
    steps:
      - name: Rollback automático
        run: |
          echo "⚠️ Error detectado en despliegue"
          echo "Revirtiendo al estado anterior..."
